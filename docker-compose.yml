# Synology: Container Manager → Project → Create → paste this file.
# Any other Docker host (Linux server, Unraid, TrueNAS, a Raspberry Pi …): the defaults below are for a
# Synology; put your own paths, user and groups in a .env file next to this one (docs/install.md,
# "Any other Docker host").
# Change the two folders after ":-" in the first two "volumes" lines to your own shared folders.
# This is the only description of the container: the automatic deploy (.gitea/workflows/deploy.yml)
# starts it from this file too, with `docker compose up`. A change here applies to both. The deploy
# fills in the ${LICHTSPIEL_…} values from its Gitea variables; a manual install takes the defaults
# after ":-" (or values from a .env file next to this one).
services:
  lichtspiel:
    build: .
    # The deploy starts lichtspiel:previous here when the new version does not become healthy.
    image: ${LICHTSPIEL_IMAGE:-lichtspiel:latest}
    container_name: lichtspiel
    restart: unless-stopped
    # Runs as uid 1026, gid 100 (the first Synology user and the users group). Other IDs: set
    # LICHTSPIEL_USER=uid:gid in a .env file next to this one. That user must own the config folder:
    # sudo chown -R 1026:100 /volume1/docker/lichtspiel (needed once when coming from an older version).
    user: "${LICHTSPIEL_USER:-1026:100}"
    # Apps find the server on the home network (UDP 32414) only with host networking: uncomment the
    # next line and remove "ports". The port is then always 8484, the DSM firewall must allow it, and
    # a Plex still running on the NAS keeps UDP 32414 for itself.
    # network_mode: host
    ports:
      - "${LICHTSPIEL_PORT:-8484}:8484"   # to use another port, change only the left number
    volumes:
      - ${LICHTSPIEL_CONFIG:-/volume1/docker/lichtspiel}:/config   # library, users, playlists, plugins, settings
      #   (set up before the rename? keep your old folder, e.g. /volume1/docker/mediaserver)
      - ${LICHTSPIEL_MEDIA:-/volume1/video}:/media:ro              # your movies and TV shows (read-only)
      # To import from your old server (Libraries page → Import), set OLD_SERVER to its data
      # folder (a .env file next to this one, or the project's environment settings in
      # Container Manager; the deploy takes LICHTSPIEL_OLD_SERVER). Read-only; the old server is
      # not changed. Without it, an empty folder is mounted and nothing is found.
      #   DSM 7 package: OLD_SERVER=/volume1/PlexMediaServer/AppData/Plex Media Server
      #   DSM 6 package: OLD_SERVER=/volume1/Plex/Library/Application Support/Plex Media Server
      - "${OLD_SERVER:-/volume1/docker/lichtspiel/oldserver}:/oldserver:ro"
    # Hardware transcoding on Intel-based models. A model without a graphics chip (no /dev/dri):
    # delete these two lines, also for the deploy.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # The videos: a Synology shared folder usually grants only "administrators" (group 101), not
      # "users", so the server (uid 1026, group 100) is refused and everything shows as missing. The
      # group joins it for reading; the folder is mounted read-only above. On another host, set
      # LICHTSPIEL_VIDEO_GROUP (in .env) to the group that may read the videos (`ls -n` on the folder),
      # or to the user's own group if that is enough.
      - "${LICHTSPIEL_VIDEO_GROUP:-101}"
      # The graphics chip: the user needs its group, the number from `ls -n /dev/dri` (the group of
      # renderD128). Set LICHTSPIEL_GPU_GROUP to it (in .env); without it ffmpeg converts on the
      # processor. The deploy looks the number up by itself. (100 is the user's own group anyway.)
      - "${LICHTSPIEL_GPU_GROUP:-100}"
