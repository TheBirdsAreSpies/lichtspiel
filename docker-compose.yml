# Synology: Container Manager → Project → Create → paste this file.
# Change the two folders on the left of each ":" to your own shared folders.
services:
  lichtspiel:
    build: .
    container_name: lichtspiel
    restart: unless-stopped
    ports:
      - "8484:8484"   # to use another port, change only the left number
    volumes:
      - /volume1/docker/lichtspiel:/config       # library, users, playlists, plugins, settings
      #   (set up before the rename? keep your old folder, e.g. /volume1/docker/mediaserver)
      - /volume1/video:/media:ro                 # your movies and TV shows (read-only)
      # To import from your old server (Libraries page → Import), set OLD_SERVER to its data
      # folder (a .env file next to this one, or the project's environment settings in
      # Container Manager). Read-only; the old server is not changed. Without it, an empty
      # folder is mounted and nothing is found.
      #   DSM 7 package: OLD_SERVER=/volume1/PlexMediaServer/AppData/Plex Media Server
      #   DSM 6 package: OLD_SERVER=/volume1/Plex/Library/Application Support/Plex Media Server
      - "${OLD_SERVER:-/volume1/docker/lichtspiel/oldserver}:/oldserver:ro"
    # Hardware transcoding on Intel-based models: keep these lines and set
    # "Hardware acceleration" to VAAPI in the web app's Settings.
    devices:
      - /dev/dri:/dev/dri
