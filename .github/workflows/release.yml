# A release: pushing a tag like v0.2.0 to GitHub builds the Docker image for Intel/AMD (amd64) and ARM
# (arm64) Synology models, publishes it as ghcr.io/<owner>/lichtspiel with the tags 0.2.0, 0.2 and
# latest, and makes a GitHub release with notes from the commits. Each architecture is built on a runner
# of its own kind (no emulation). The tag has to match the version in Cargo.toml (docs/development.md).
# The NAS does not use this: it builds its own image from Gitea (.gitea/workflows/deploy.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$cargo" != "$tag" ]; then
            echo "::error::The tag says $tag, Cargo.toml says $cargo. Raise the version in Cargo.toml (and Cargo.lock), commit, then tag that commit."
            exit 1
          fi
      # GHCR wants the name in lowercase.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Image (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.check.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # The tests first, as the deploy on the NAS does (the test stage is not part of the image).
      - name: Tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      # Pushed by its digest only; the merge job below gives the two one set of tags.
      - name: Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Note the digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish image and release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.2.0 → 0.2.0, 0.2 and latest (a pre-release like v0.2.0-rc.1 gets only its own tag).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: One image for both architectures
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag $pre \
            --notes "Docker image: \`$IMAGE:${GITHUB_REF_NAME#v}\` (amd64 and arm64)."
