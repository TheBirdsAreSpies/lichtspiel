# The app for a release on Gitea: pushing a tag like v0.2.0 builds the Android app (APK) on the NAS and
# attaches it to the Gitea release of that tag, which is made when it does not exist yet. The Windows and
# macOS apps need runners with those systems; GitHub builds them (.github/workflows/release.yml).
#
# The NAS has no Flutter, so the build runs in a container (clients/lichtspiel/android.Dockerfile; Docker
# keeps it, so only the first run downloads it). The source goes in and the APK comes out with `docker cp`,
# which also works when the runner itself runs in a container.
#
# Secrets in Gitea (repository → Settings → Actions → Secrets), the same as on GitHub:
#   ANDROID_KEYSTORE           the signing key (.jks) in base64; without it the APK is signed with a throwaway
#                              key and cannot update an installed app (docs/development.md, "Releases")
#   ANDROID_KEYSTORE_PASSWORD  its password
#   RELEASE_TOKEN              optional: a Gitea access token (repository: read and write) when the run's own
#                              token may not make releases
name: App release

on:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: nas
    defaults:
      run:
        shell: bash
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      BOX: lichtspiel-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*) ;; *) echo "Run this for a tag like v0.2.0 (it is $GITHUB_REF_NAME)."; exit 1;; esac
          v=${GITHUB_REF_NAME#v}; base=${v%%-*}
          IFS=. read -r ma mi pa <<< "$base"
          echo "NAME=$base" >> "$GITHUB_ENV"
          echo "NUMBER=$((ma * 10000 + mi * 100 + pa))" >> "$GITHUB_ENV"

      - name: Build tools
        run: docker build -f clients/lichtspiel/android.Dockerfile -t lichtspiel-flutter clients/lichtspiel

      - name: Build the APK
        run: |
          [ -n "$KEYSTORE" ] || echo "::warning::No ANDROID_KEYSTORE secret: the APK is signed with a throwaway key and cannot update an installed app."
          docker rm -f "$BOX" >/dev/null 2>&1 || true
          trap 'docker rm -f "$BOX" >/dev/null 2>&1 || true' EXIT
          # The Gradle downloads are kept in a volume for the next release.
          docker create --name "$BOX" -w /src -e KEYSTORE -e KEYSTORE_PASSWORD -e NAME -e NUMBER \
            -v lichtspiel-gradle:/root/.gradle lichtspiel-flutter bash -ec '
              if [ -n "$KEYSTORE" ]; then
                echo "$KEYSTORE" | base64 -d > /tmp/release.jks
                export LICHTSPIEL_KEYSTORE=/tmp/release.jks LICHTSPIEL_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
              fi
              flutter pub get
              flutter build apk --release --build-name="$NAME" --build-number="$NUMBER"'
          docker cp clients/lichtspiel/. "$BOX:/src"
          docker start -a "$BOX"
          docker cp "$BOX:/src/build/app/outputs/flutter-apk/app-release.apk" "lichtspiel-$NAME-android.apk"
          ls -l "lichtspiel-$NAME-android.apk"

      - name: Attach it to the Gitea release
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          file="lichtspiel-$NAME-android.apk"
          id=$(curl -fsS -H "$auth" "$api/releases/tags/$GITHUB_REF_NAME" 2>/dev/null | sed -n 's/^{"id":\([0-9]*\).*/\1/p' || true)
          if [ -z "$id" ]; then
            pre=false; case "$GITHUB_REF_NAME" in *-*) pre=true;; esac
            id=$(curl -fsS -H "$auth" -H 'Content-Type: application/json' -X POST "$api/releases" \
              -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"prerelease\":$pre,\"body\":\"The Android app is attached. Windows and macOS: the GitHub release of the same tag.\"}" \
              | sed -n 's/^{"id":\([0-9]*\).*/\1/p')
          fi
          [ -n "$id" ] || { echo "Could not find or make the release (may the token make releases? See RELEASE_TOKEN at the top of this file)."; exit 1; }
          # A second run replaces the file.
          old=$(curl -fsS -H "$auth" "$api/releases/$id/assets" | tr '{' '\n' | grep "\"name\":\"$file\"" | sed -n 's/^"id":\([0-9]*\).*/\1/p' || true)
          for a in $old; do curl -fsS -H "$auth" -X DELETE "$api/releases/$id/assets/$a"; done
          curl -fsS -H "$auth" -F "attachment=@$file" "$api/releases/$id/assets?name=$file" >/dev/null
          echo "Attached $file to $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
