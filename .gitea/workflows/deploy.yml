# Builds Lichtspiel on every push to main and starts the new version on the Synology.
#
# The runner (act_runner, label "nas") runs on the Synology and uses its Docker, so the image is
# built there and the container is replaced - the same way fetchr is deployed. Steps: tests -> image -> replace the container -> health
# check (if the new version does not become healthy, the previous one is started again).
#
# Settings in Gitea (repository -> Settings -> Actions -> Variables); all optional:
#   LICHTSPIEL_CONFIG   folder for the database and settings   (default /volume1/docker/lichtspiel)
#   LICHTSPIEL_MEDIA    folder with the videos, read-only       (default /volume1/video)
#   LICHTSPIEL_OLD_SERVER  the old Plex server's data folder for the import, read-only, shown as
#                       /oldserver (e.g. /volume1/PlexMediaServer/AppData/Plex Media Server; default none)
#   LICHTSPIEL_PORT     port on the Synology                    (default 8484)
#   LICHTSPIEL_USER     the user the server runs as, uid:gid (default 1026:100).
#                       That user must own the config folder; coming from an older version (which ran as
#                       root), run once on the NAS: sudo chown -R 1026:100 /volume1/docker/lichtspiel.
#                       The deploy stops before touching the running server if it can't write there.
#
# The container itself (mounts, ports, the graphics chip, groups, host networking) is described only in
# docker-compose.yml; this workflow starts it from there with `docker compose up`, filling in the variables
# above. To change the container, change that file: a manual install and the deploy then stay alike.
# The deploy adds the group of /dev/dri/renderD128 (LICHTSPIEL_GPU_GROUP) by itself.
# It replaces a container named lichtspiel, also one that Container Manager created.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NAME: lichtspiel
  # Read by docker-compose.yml; empty means its default.
  LICHTSPIEL_CONFIG: ${{ vars.LICHTSPIEL_CONFIG }}
  LICHTSPIEL_MEDIA: ${{ vars.LICHTSPIEL_MEDIA }}
  LICHTSPIEL_PORT: ${{ vars.LICHTSPIEL_PORT }}
  LICHTSPIEL_USER: ${{ vars.LICHTSPIEL_USER }}
  OLD_SERVER: ${{ vars.LICHTSPIEL_OLD_SERVER }}
  # Settings of earlier versions that docker-compose.yml replaces; only warned about.
  OLD_DOCKER_ARGS: ${{ vars.LICHTSPIEL_DOCKER_ARGS }}
  OLD_MEDIA_GROUPS: ${{ vars.LICHTSPIEL_MEDIA_GROUPS }}

jobs:
  deploy:
    # Same runner and way as fetchr: the runner on the Synology (label "nas", host mode) starts the
    # container through the Docker socket of the Synology.
    runs-on: nas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker usable?
        run: |
          docker version --format 'Docker {{.Server.Version}}' || {
            echo "The runner cannot use Docker (on a Synology: run act_runner as root or add its user to the docker group)."; exit 1; }
          docker compose version || docker-compose version || {
            echo "Neither 'docker compose' nor 'docker-compose' works on the runner (Container Manager brings it on DSM 7.2)."; exit 1; }
          if [ -n "${OLD_DOCKER_ARGS}${OLD_MEDIA_GROUPS}" ]; then
            echo "::warning::LICHTSPIEL_DOCKER_ARGS and LICHTSPIEL_MEDIA_GROUPS are no longer used; the container is described in docker-compose.yml (devices, group_add, network_mode). Delete the variables."
          fi

      - name: Tests
        run: docker build --target test --build-arg GIT_SHA=${GITHUB_SHA::8} -t ${NAME}-test .

      - name: Build the image
        run: |
          # Keep the version that is running now as "previous" for the way back.
          running=$(docker inspect --format '{{.Image}}' ${NAME} 2>/dev/null || true)
          [ -n "$running" ] && docker tag "$running" ${NAME}:previous || true
          docker build --build-arg GIT_SHA=${GITHUB_SHA::8} -t ${NAME}:latest .

      - name: Replace the container
        run: |
          if docker compose version >/dev/null 2>&1; then dc="docker compose"; else dc=docker-compose; fi
          # The project gets the container's name, so Container Manager shows it as "lichtspiel".
          start() {
            docker rm -f ${NAME} >/dev/null 2>&1 || true
            LICHTSPIEL_IMAGE="$1" $dc -p ${NAME} -f docker-compose.yml up -d --no-build --force-recreate
          }
          # Up to 10 minutes: the first start after an update may first convert the database.
          healthy() {
            for i in $(seq 1 150); do
              s=$(docker inspect --format '{{.State.Health.Status}}' ${NAME} 2>/dev/null || echo none)
              [ "$s" = healthy ] && return 0
              [ "$(docker inspect --format '{{.State.Running}}' ${NAME} 2>/dev/null)" = true ] || return 1
              sleep 4
            done
            return 1
          }
          CONFIG_DIR=${LICHTSPIEL_CONFIG:-/volume1/docker/lichtspiel}
          RUN_AS=${LICHTSPIEL_USER:-1026:100}
          # The image doesn't run as root: stop here, with the old server still running, if it couldn't
          # write the config folder. (/config/oldserver is the empty stand-in for the old server's folder,
          # made by Docker and mounted read-only; it doesn't count.)
          if docker run --rm --user=$RUN_AS -v "${CONFIG_DIR}:/config" --entrypoint sh ${NAME}:latest \
              -c 'find /config -path /config/oldserver -prune -o ! -writable -print -quit 2>/dev/null | grep -q .'; then
            echo "The server's user ($(docker run --rm --user=$RUN_AS --entrypoint id ${NAME}:latest)) cannot write everything in ${CONFIG_DIR}."
            echo "Run once on the NAS: sudo chown -R ${RUN_AS} ${CONFIG_DIR}"
            exit 1
          fi
          # The server's user may open the graphics chip only as a member of its group, so look the group up
          # through the new image (that also works when the runner runs in a container). Without a chip
          # (docker-compose.yml then has no devices) the compose default stays.
          if [ -z "${LICHTSPIEL_GPU_GROUP}" ] && grep -q '^ *- /dev/dri:/dev/dri' docker-compose.yml; then
            gid=$(docker run --rm --device /dev/dri:/dev/dri --entrypoint stat ${NAME}:latest -c %g /dev/dri/renderD128 2>/dev/null || true)
            if [ -n "$gid" ]; then export LICHTSPIEL_GPU_GROUP=$gid; else echo "No /dev/dri/renderD128 found: the server will convert videos on the processor."; fi
          fi
          # Starting is part of the check: a failed start (bash -e) must also lead to the rollback.
          if start ${NAME}:latest && healthy; then
            echo "Lichtspiel ${GITHUB_SHA::8} is running."
          else
            echo "The new version did not become healthy:"
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{end}} error={{.State.Error}}' ${NAME} || true
            docker logs --tail 60 ${NAME} || true
            echo "--- server.log (the app writes its messages there, not to the container log):"; tail -n 40 "${CONFIG_DIR}/server.log" || true
            if docker image inspect ${NAME}:previous >/dev/null 2>&1; then
              echo "Starting the previous version again. Everyone may have to sign in again on every device: once the"
              echo "new version has started, it stores sign-ins only as fingerprints, which the previous version can't read."
              start ${NAME}:previous
            fi
            exit 1
          fi

      - name: Tidy up
        run: |
          # Earlier versions also tagged every build with its commit; those images are removed here.
          docker images ${NAME} --format '{{.Tag}}' | grep -vx -e latest -e previous -e '<none>' | while read -r tag; do
            docker rmi "${NAME}:${tag}" >/dev/null || true
          done || true
          docker image prune -f >/dev/null || true
