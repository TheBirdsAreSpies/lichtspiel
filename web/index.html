<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lichtspiel</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#13161a;--panel:#1c2025;--panel2:#252a30;--line:#2e343b;--text:#eceef1;--dim:#9aa1aa;--accent:#f2a516;--accent2:#ffbf3f;--red:#e5534b;--green:#55c773;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:#4a525b}
button.primary{background:var(--accent);border-color:var(--accent);color:#16120a;font-weight:600}
button.primary:hover{background:var(--accent2)}
button.danger{color:var(--red)}
button.small{padding:3px 9px;font-size:13px}
input,select,textarea{background:#101317;border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
label{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px}
.field{display:grid;grid-template-columns:240px minmax(0,1fr);gap:4px 18px;align-items:center;margin:12px 0}
.field>label{margin:0;font-size:14px}
.field.top{align-items:start}
.field.top>label{padding-top:8px}
.field>.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0}
.field>.ctl>input[type=checkbox]{margin:0}
.field select{max-width:100%}
.field>.help{grid-column:2;font-size:13px}
.modal .field{grid-template-columns:150px minmax(0,1fr)}
#top{position:fixed;top:0;left:0;right:0;height:56px;background:var(--panel);display:flex;align-items:center;gap:16px;padding:0 18px;z-index:5;border-bottom:1px solid #0c0e10}
#top .logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;min-width:190px}
#top .logo svg{width:22px;height:22px}
#search{flex:0 1 420px;margin-left:auto;margin-right:auto}
#search input{width:100%;background:var(--panel2);border-color:transparent}
#who{color:var(--dim);font-size:14px;display:flex;gap:10px;align-items:center}
#side{position:fixed;top:56px;bottom:0;left:0;width:220px;background:var(--panel);overflow:auto;padding:14px 0}
#side a{display:flex;justify-content:space-between;padding:9px 22px;color:var(--dim);border-left:4px solid transparent}
#side a:hover{color:var(--text)}
#side a.on{color:var(--text);background:var(--panel2);border-left-color:var(--accent)}
#side .head{font-size:11px;letter-spacing:.08em;color:#6f7780;padding:16px 22px 6px}
#side small{color:#6f7780}
#main{margin:56px 0 0 220px;padding:26px 30px 60px;min-height:calc(100vh - 56px)}
h1{font-size:26px;margin:0 0 18px}
h2{font-size:19px;margin:28px 0 12px}
.dim{color:var(--dim)}
*{scrollbar-width:thin;scrollbar-color:#3a414a transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a414a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.row{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 8px;scroll-behavior:smooth;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.rowwrap{position:relative}
.rowwrap .arrow{position:absolute;top:4px;bottom:8px;width:44px;z-index:2;border:0;border-radius:0;padding:0;font-size:30px;line-height:1;color:#fff;opacity:0;transition:opacity .15s;display:none}
.rowwrap .arrow.l{left:-30px;background:linear-gradient(to right,var(--bg) 30%,transparent)}
.rowwrap .arrow.r{right:-30px;background:linear-gradient(to left,var(--bg) 30%,transparent)}
.rowwrap .arrow.show{display:block}
.rowwrap:hover .arrow.show{opacity:1}
.rowwrap .arrow:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card,140px),1fr));gap:22px 18px}
.card{width:140px;flex:0 0 140px;cursor:pointer}
.grid .card{width:auto}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.6)}
.poster .bar i{display:block;height:100%;background:var(--accent)}
.poster .badge{position:absolute;top:6px;right:6px;background:var(--accent);color:#16120a;font-size:12px;font-weight:700;border-radius:10px;padding:0 7px}
.card.watched .poster::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:none;transition:background .15s}
.card.watched:hover .poster::before{background:rgba(0,0,0,.25)}
.poster .seen{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#16120a;font-size:13px;font-weight:800;line-height:22px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.poster .pick{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s;cursor:pointer;color:#16120a;font-size:14px;font-weight:800;line-height:20px;text-align:center}
.poster .pick:hover{border-color:var(--accent)}
.card:hover .pick,.grid.picking .pick{opacity:1}
.card.picked .pick{background:var(--accent);border-color:var(--accent)}
.card.picked .pick::after{content:"\2713"}
.card:hover .poster,.card.picked .poster{outline:3px solid var(--accent)}
.poster .more{position:absolute;right:6px;bottom:10px;width:30px;height:30px;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:28px;opacity:0;transition:opacity .15s}
.poster .more:hover,.poster .more:focus-visible{background:var(--accent);color:#16120a}
.card:hover .more,.poster .more:focus-visible{opacity:1}
@media (hover:none){.poster .more{opacity:1}}
.menu{position:fixed;z-index:30;min-width:220px;max-width:min(340px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 0;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.menu .mi{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:8px 16px;font-size:14px}
.menu .mi:hover,.menu .mi:focus{background:var(--line);outline:none}
.menu .mi.danger{color:var(--red)}
.menu .mi[disabled]{opacity:.45;cursor:default}
.menu .sep{height:1px;background:var(--line);margin:5px 0}
#qchip{white-space:nowrap}
.pickbar{position:fixed;bottom:22px;left:calc(50% + 110px);transform:translateX(-50%);z-index:15;display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:calc(100vw - 260px)}
.pickbar.show{display:flex}
.pickbar b{margin-right:4px;white-space:nowrap}
.bar-tools .size{display:flex;align-items:center;gap:6px;margin:0}
.bar-tools .size input{width:110px;padding:0;border:0;background:none;accent-color:var(--accent)}
.card .t{margin-top:7px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 20px;padding:12px;background:var(--panel);border-radius:var(--r)}
.bar-tools .grow{flex:1}
.filter-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;margin:-10px 0 20px;padding:12px;background:var(--panel);border-radius:var(--r)}
.filter-panel label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.filter-panel label.on{color:inherit;font-weight:600}
.filter-panel select{width:100%}
.tabs{display:flex;gap:4px;margin:-4px 0 16px;flex-wrap:wrap}
.tabs a{padding:7px 14px;border-radius:var(--r);color:var(--dim);text-decoration:none}
.tabs a:hover{color:inherit}
.tabs a.on{background:var(--panel);color:inherit;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cat{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--panel)}
.cat img{width:100%;height:100%;object-fit:cover;filter:brightness(.55);transition:filter .15s}
.cat:hover img{filter:brightness(.8)}
.cat div{position:absolute;left:12px;bottom:10px;right:12px;font-weight:700;font-size:18px;text-shadow:0 1px 4px #000}
.cat small{display:block;font-weight:400;font-size:12px;opacity:.85}
.panel{background:var(--panel);border-radius:var(--r);padding:18px;margin-bottom:16px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:var(--r);padding:10px 14px}
.li .grow{flex:1;min-width:0}
.li img{width:44px;height:66px;object-fit:cover;border-radius:4px;background:var(--panel2)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--panel2);color:var(--dim);margin-right:4px}
.tag.smart{background:#2b2312;color:var(--accent)}
.tag.default{background:#1d2a22;color:var(--green)}
.detail{display:flex;gap:30px;align-items:flex-start}
.detail .poster{width:240px;flex:0 0 240px}
.detail .info{flex:1;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
#main{position:relative}
#main > *{position:relative}
#main > img.hero{position:absolute;top:0;left:0;width:100%;height:420px;object-fit:cover;opacity:.22;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent);mask-image:linear-gradient(to bottom,#000 40%,transparent)}
.plot{line-height:1.55;max-width:820px;white-space:pre-line}
.credits{margin-top:10px;max-width:820px}
.row.cast{gap:14px}
.row.extras .poster{aspect-ratio:16/9}.row.extras .card{width:260px;flex-basis:260px}
.person{width:110px;flex:0 0 110px;font-size:13px}
.person img,.person .initials{width:110px;height:150px;border-radius:6px;object-fit:cover;background:var(--panel2);display:block;margin-bottom:6px}
.initials{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:var(--dim);background:var(--panel2);border-radius:6px}
.person .initials{display:flex}
.ep-plot{color:var(--dim);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500}
.center{max-width:380px;margin:9vh auto;background:var(--panel);padding:30px;border-radius:12px}
.center input{width:100%}
.err{color:var(--red);margin-top:10px;min-height:20px}
.ok{color:var(--green)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:8px;display:none;z-index:30}
#player{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#player video{flex:1;width:100%;min-height:0;background:#000}
#player .pbar{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#111;flex-wrap:wrap}
#player .pbar .grow{flex:1}
#player input[type=range]{flex:1;min-width:160px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25;display:flex;align-items:center;justify-content:center}
.modal .box{background:var(--panel);border-radius:12px;padding:22px;width:min(640px,94vw);max-height:86vh;overflow:auto}
.rule{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rule select,.rule input{flex:1;min-width:110px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;margin:0;color:var(--text)}
code{background:#0e1013;padding:1px 6px;border-radius:4px;font-size:13px}
.apigroup{padding:12px 18px}
.apigroup summary{cursor:pointer;font-size:16px;list-style:none;display:flex;gap:6px;align-items:center}
.apigroup summary::before{content:"\25B8";color:var(--dim);transition:transform .15s;display:inline-block}
.apigroup[open] summary::before{transform:rotate(90deg)}
.apigroup table{margin-top:10px}
code.m-get{color:#6cb6ff}code.m-post{color:var(--green)}code.m-put,code.m-patch{color:var(--accent)}code.m-delete{color:var(--red)}
.badge{display:inline-block;margin-left:6px;font-size:11px;padding:0 7px;border-radius:9px;background:#2b2312;color:var(--accent)}
#activity{display:none;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:var(--panel2);border-radius:14px;padding:4px 12px;max-width:360px;white-space:nowrap;overflow:hidden;cursor:default}
#activity .txt{overflow:hidden;text-overflow:ellipsis}
#activity .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;flex:0 0 12px}
#activity .pbar{display:inline-block;width:60px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:0 0 60px}
#activity .pbar i{display:block;height:100%;background:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.stars{display:inline-flex;align-items:center;gap:2px}
.stars button{background:none;border:0;padding:0 1px;font-size:26px;line-height:1;color:#4a525b;cursor:pointer}
.stars button.on{color:var(--accent)}
.stars button.half{background:linear-gradient(90deg,var(--accent) 50%,#4a525b 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars .clear{font-size:13px;color:var(--dim);margin-left:8px;background:none;border:0;cursor:pointer}
.scores{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.score{display:inline-flex;align-items:center;gap:10px;background:var(--panel2);border-radius:8px;padding:6px 12px;color:inherit;text-decoration:none}
.score .mark{display:flex;flex:none}
.score .mark svg{height:26px;width:auto;display:block}
.score .num{display:flex;flex-direction:column;line-height:1.2}
.score b{font-size:17px}
.score span{font-size:11px;color:var(--dim);letter-spacing:.03em}
.empty{padding:40px;text-align:center;color:var(--dim);background:var(--panel);border-radius:var(--r)}
@media (max-width:760px){.field,.modal .field{grid-template-columns:minmax(0,1fr);gap:4px}.field>.help{grid-column:1}.field.top>label{padding-top:0}#side{display:none}#main{margin-left:0;padding:18px}.pickbar{left:50%;max-width:calc(100vw - 32px)}#top .logo{min-width:0}.detail{flex-direction:column}.detail .poster{width:180px;flex-basis:auto}}
</style>
</head>
<body>
<div id="top">
  <a class="logo" href="#/"><svg viewBox="0 0 32 32"><path d="M8 5l20 11-20 11z" fill="#f2a516"/></svg><span id="sname">Lichtspiel</span></a>
  <div id="search"><input id="q" placeholder="Search movies and shows" data-t-placeholder="Search movies and shows" autocomplete="off"></div>
  <div id="activity" title="Background work on the server" data-t-title="Background work on the server"></div>
  <div id="who"></div>
</div>
<nav id="side">
  <a href="#/" data-nav="home" data-t="Home">Home</a>
  <div id="navsections"></div>
  <a href="#/playlists" data-nav="playlists" data-t="Playlists">Playlists</a>
  <div class="head admin" data-t="MANAGE">MANAGE</div>
  <a class="admin" href="#/libraries" data-nav="libraries" data-t="Libraries">Libraries</a>
  <a class="admin" href="#/users" data-nav="users" data-t="Users &amp; invites">Users &amp; invites</a>
  <a class="admin" href="#/plugins" data-nav="plugins" data-t="Plugins">Plugins</a>
  <a class="admin" href="#/reports" data-nav="reports" data-t="Reported problems">Reported problems</a>
  <a href="#/settings" data-nav="settings" data-t="Settings">Settings</a>
  <a href="#/api" data-nav="api">API</a>
</nav>
<main id="main"><p class="dim" data-t="Loading…">Loading…</p></main>
<div id="player">
  <video id="video" controls playsinline crossorigin="anonymous"></video>
  <div class="pbar">
    <button id="pclose" data-t="✕ Close">✕ Close</button>
    <b id="ptitle"></b><span class="dim" id="pmethod"></span><span class="dim" id="ptogether"></span>
    <span class="grow"></span>
    <span id="pjump" style="display:none;align-items:center;gap:8px;flex:1"><span class="dim" data-t="Jump">Jump</span><input id="pseek" type="range" min="0" max="100" value="0"><span id="ptime" class="dim"></span></span>
    <select id="pspeed" title="Playback speed" data-t-title="Playback speed"></select>
    <select id="pquality" title="Quality" data-t-title="Quality"></select>
    <select id="paudio" title="Audio track" data-t-title="Audio track"></select>
  </div>
</div>
<div id="toast"></div>
<script src="/web/i18n.js"></script>
<script src="/web/lang/de.js"></script>
<script src="/web/app.js"></script>
<script src="/web/pages.js"></script>
</body>
</html>
